<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Abstract AI engineer portrait placeholder</title>
  <desc id="desc">A professional abstract portrait with neural network lines and cool modern colors.</desc>
  <defs>
